[package]
name = "moddeck"
version = "3.1.0-beta.1"
description = "Open-source local mod manager for 3DMigoto / XXMI games"
authors = ["yuzhoujun <2445665133@qq.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "moddeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
walkdir = "2"
tauri-plugin-dialog = "2"
winreg = "0.56"
sha1 = "0.10"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
sevenz-rust = { version = "0.6", features = ["aes256"] }
unrar = "0.5"
encoding_rs = "0.8"
trash = "5"
time = { version = "0.3", features = ["formatting", "parsing"] }
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
