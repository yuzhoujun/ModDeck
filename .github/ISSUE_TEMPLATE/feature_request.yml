name: 💡 需求与改进建议 / Feature Suggestion
description: 提出对 ModDeck 的新功能构想或 UI/UX 体验优化建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 相关的场景与痛点 / Problem Statement
      placeholder: 请描述当前在什么场景下遇到不便，或希望解决什么痛点...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案 / Proposed Solution
      placeholder: 请清晰描述您希望 ModDeck 增加什么功能、按钮、交互或处理逻辑...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选方案或参考 / Alternatives Considered
      placeholder: 是否有其他 Mod 管理器或同类工具的做法可供参考...
    validations:
      required: false
